<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Scriptura</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --muted: #6b6b6b; --bg: #fafafa; --accent: #4f46e5; --card: #fff; --border: #e5e5e5; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ececec; --muted: #9a9a9a; --bg: #111; --card: #1b1b1b; --border: #2a2a2a; --accent: #8b85ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 32rem; padding: 2rem; margin: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  h1 { margin: 0 0 .25rem; font-size: 1.4rem; }
  p { margin: .5rem 0; color: var(--muted); }
  a { color: var(--accent); word-break: break-all; }
  button { margin-top: 1rem; padding: .5rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--fg); cursor: pointer; }
  .spinner { display: inline-block; width: .8em; height: .8em; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -.1em; margin-right: .4em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Scriptura</h1>
  <p id="status"><span class="spinner"></span>Checking whether the app is up…</p>
  <p><small>Current address: <a id="link" href="https://spokesman-mods-bikes-basis.trycloudflare.com">https://spokesman-mods-bikes-basis.trycloudflare.com</a><br>Updated 2026-09-15 15:16 UTC</small></p>
  <button id="retry" hidden onclick="location.reload()">Try again</button>
</main>
<script>
  /* The app runs on a home machine behind a temporary Cloudflare tunnel whose
     address changes now and then; this page is the permanent one.

     GitHub Pages serves this HTML with Cache-Control: max-age=600, so a
     returning visitor can be holding a ten-minute-old copy with a since-dead
     address baked in. To survive that, the live address is read from
     current.txt (same origin, cache-busted) and the baked-in one is only a
     fallback. Each candidate must answer /health before we send anyone to it,
     so a dead address shows a message instead of a Cloudflare error page. */
  var BAKED = "https://dead-address-test-stale.trycloudflare.com";
  var statusEl = document.getElementById("status");
  var linkEl = document.getElementById("link");
  var retryEl = document.getElementById("retry");

  function setLink(url) {
    linkEl.textContent = url;
    linkEl.href = url;
  }

  function withTimeout(promise, ms) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms);
    return { signal: ctrl.signal, done: function () { clearTimeout(timer); } };
  }

  function liveAddress() {
    var t = withTimeout(null, 5000);
    return fetch("current.txt?t=" + Date.now(), { cache: "no-store", signal: t.signal })
      .then(function (r) { t.done(); return r.ok ? r.text() : ""; })
      .then(function (text) {
        var url = (text || "").trim();
        return /^https:\/\/[a-z0-9.-]+$/i.test(url) ? url : "";
      })
      .catch(function () { t.done(); return ""; });
  }

  function alive(url) {
    var t = withTimeout(null, 7000);
    return fetch(url + "/health", { cache: "no-store", signal: t.signal })
      .then(function (r) { t.done(); return r.ok; })
      .catch(function () { t.done(); return false; });
  }

  function go(url) {
    statusEl.textContent = "Taking you to Scriptura\u2026";
    location.replace(url + location.search + location.hash);
  }

  function offline() {
    statusEl.textContent = "Scriptura is offline right now \u2014 the machine it runs on is off or asleep. Try again in a minute.";
    retryEl.hidden = false;
  }

  /* Try the freshly-published address first, then the one baked into this
     copy of the page. They're usually the same; they differ exactly when this
     page came from a cache. */
  liveAddress().then(function (live) {
    var candidates = [];
    if (live) candidates.push(live);
    if (candidates.indexOf(BAKED) === -1) candidates.push(BAKED);
    if (live && live !== BAKED) setLink(live);

    (function attempt(i) {
      if (i >= candidates.length) return offline();
      setLink(candidates[i]);
      alive(candidates[i]).then(function (ok) {
        if (ok) go(candidates[i]);
        else attempt(i + 1);
      });
    })(0);
  });
</script>
</body>
</html>
