<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Scriptura</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --muted: #6b6b6b; --bg: #fafafa; --accent: #4f46e5; --card: #fff; --border: #e5e5e5; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ececec; --muted: #9a9a9a; --bg: #111; --card: #1b1b1b; --border: #2a2a2a; --accent: #8b85ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 32rem; padding: 2rem; margin: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  h1 { margin: 0 0 .25rem; font-size: 1.4rem; }
  p { margin: .5rem 0; color: var(--muted); }
  a { color: var(--accent); word-break: break-all; }
  button { margin-top: 1rem; padding: .5rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--fg); cursor: pointer; }
  .spinner { display: inline-block; width: .8em; height: .8em; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -.1em; margin-right: .4em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Scriptura</h1>
  <p id="status"><span class="spinner"></span>Checking whether the app is up…</p>
  <p><small>Current address: <a id="link" href="https://admissions-cyber-editorial-salon.trycloudflare.com">https://admissions-cyber-editorial-salon.trycloudflare.com</a><br>Updated 2026-10-30 15:13 UTC</small></p>
  <button id="retry" hidden type="button">Try again</button>
</main>
<script>
  /* The app runs on a home machine behind a temporary Cloudflare tunnel whose
     address changes now and then; this page is the permanent one.

     Where the address comes from, in order:

       1. raw.githubusercontent.com — authoritative. Updates the moment the
          watcher pushes, because it serves the file straight from the repo
          with no build step. GitHub Pages, by contrast, has to rebuild: that
          normally takes half a minute but has been observed stuck "building"
          for the better part of an hour, during which the whole Pages site —
          this HTML *and* its copy of current.txt — serves a dead address.
          Reading the repo directly takes that pipeline off the critical path.
       2. current.txt on this site — fallback if raw is unreachable.
       3. The address baked into this HTML — last resort, and the stalest,
          since a browser may hold this file for up to max-age=600.

     Each candidate must answer /health before anyone is sent to it. If none
     do, the tunnel is probably mid-repair (the watcher restarts it and
     republishes within a minute or two), so this retries on its own rather
     than making the visitor keep pressing a button. */
  var RAW = "https://raw.githubusercontent.com/Ro-wdy/scriptura-link/main/current.txt";
  var BAKED = "https://admissions-cyber-editorial-salon.trycloudflare.com";
  var statusEl = document.getElementById("status");
  var linkEl = document.getElementById("link");
  var retryEl = document.getElementById("retry");
  var round = 0;
  var MAX_ROUNDS = 20;          // ~3 minutes of patience
  var RETRY_MS = 9000;

  function setLink(url) { linkEl.textContent = url; linkEl.href = url; }

  function fetchText(url, ms) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms);
    return fetch(url, { cache: "no-store", signal: ctrl.signal })
      .then(function (r) { clearTimeout(timer); return r.ok ? r.text() : ""; })
      .catch(function () { clearTimeout(timer); return ""; });
  }

  function clean(text) {
    var url = (text || "").trim();
    return /^https:\/\/[a-z0-9.-]+$/i.test(url) ? url : "";
  }

  function candidates() {
    var bust = "?t=" + Date.now();
    return fetchText(RAW + bust, 6000).then(function (raw) {
      return fetchText("current.txt" + bust, 5000).then(function (pages) {
        var list = [];
        [clean(raw), clean(pages), BAKED].forEach(function (u) {
          if (u && list.indexOf(u) === -1) list.push(u);
        });
        return list;
      });
    });
  }

  function alive(url) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 7000);
    return fetch(url + "/health", { cache: "no-store", signal: ctrl.signal })
      .then(function (r) { clearTimeout(timer); return r.ok; })
      .catch(function () { clearTimeout(timer); return false; });
  }

  function attempt() {
    round++;
    retryEl.hidden = true;
    statusEl.textContent = round === 1
      ? "Checking whether the app is up\u2026"
      : "Still reconnecting\u2026 (attempt " + round + ")";

    candidates().then(function (list) {
      if (!list.length) return give_up();
      setLink(list[0]);
      (function next(i) {
        if (i >= list.length) return give_up();
        setLink(list[i]);
        alive(list[i]).then(function (ok) {
          if (ok) {
            statusEl.textContent = "Taking you to Scriptura\u2026";
            location.replace(list[i] + location.search + location.hash);
          } else {
            next(i + 1);
          }
        });
      })(0);
    });
  }

  function give_up() {
    if (round < MAX_ROUNDS) {
      statusEl.textContent =
        "Scriptura is reconnecting \u2014 this usually takes a minute. Retrying automatically\u2026";
      retryEl.hidden = false;
      setTimeout(attempt, RETRY_MS);
    } else {
      statusEl.textContent =
        "Scriptura is offline \u2014 the machine it runs on is off or asleep. Try again later.";
      retryEl.hidden = false;
    }
  }

  retryEl.addEventListener("click", function (e) { e.preventDefault(); round = 0; attempt(); });
  attempt();
</script>
</body>
</html>
